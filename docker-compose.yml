
services:
  db:
    image: postgres:18
    container_name: scx-db
    environment:
      POSTGRES_DB: SCX
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Basket123@@
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    container_name: scx-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://scx-db:5432/SCX
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Basket123@@
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    restart: always

volumes:
  postgres_data: